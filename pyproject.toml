[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"



[project]
name = "secop-to-nexus"
dynamic = ["version"]
description = "transformer to convert secop data to nexus format"
requires-python = ">= 3.12"

dependencies = [
    "numpy==2.5.5",
    "h5py",
    "nexuscreator==2.0.2",
    "frappy-core==0.20.9",
]

[dependency-groups]
dev = [
    "ipykernel",
    "black",
    "isort",
    "nbstripout",
    "pytest",
    "mypy",
    "pre-commit",
]

all = [
    {include-group = "dev"},
]



[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["src/secop_to_nexus/_version.py"]



[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/secop_to_nexus/_version.py"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v"
filterwarnings = "ignore::PendingDeprecationWarning"
